name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -f docker/api-server.Dockerfile .
      - run: docker build -f docker/admin-web.Dockerfile .

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            cd /opt/fullstack-admin-system
            git pull
            docker compose pull
            docker compose up -d --build
